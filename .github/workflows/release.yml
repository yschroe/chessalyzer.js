name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to preview (without v), e.g. 4.0.0-alpha.1'
        required: true
        type: string

permissions:
  contents: write # For creating the GitHub release
  id-token: write # OIDC for NPM release

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Resolve version
        id: version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            VERSION="${{ inputs.version }}"
          else
            VERSION="${GITHUB_REF#refs/tags/v}"
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"

      - uses: ./.github/actions/setup

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      - name: Upgrade npm for trusted publishing
        run: npm install -g npm@latest

      - name: Validate package version matches tag
        if: github.event_name == 'push'
        run: |
          PKG_VERSION=$(bun -e "console.log(require('./package.json').version)")
          if [ "$PKG_VERSION" != "${{ steps.version.outputs.version }}" ]; then
            echo "::error::package.json version ($PKG_VERSION) does not match tag (${{ steps.version.outputs.version }})"
            exit 1
          fi

      - name: Validate npm package (dry run)
        run: node scripts/npm-publish.mjs --dry-run

      - name: Generate release notes
        run: node scripts/release-notes.mjs "${{ steps.version.outputs.version }}"

      - name: Preview release notes
        if: github.event_name == 'workflow_dispatch'
        run: cat RELEASE_BODY.md >> "$GITHUB_STEP_SUMMARY"

      - name: Publish to npm
        if: github.event_name == 'push'
        run: node scripts/npm-publish.mjs

      - name: Create GitHub release
        if: github.event_name == 'push'
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: ${{ steps.version.outputs.tag }}
          body_path: RELEASE_BODY.md
          prerelease: ${{ contains(steps.version.outputs.version, '-') }}
