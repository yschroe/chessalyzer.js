name: 'Setup'
description: 'Setup steps including checkout, bun setup, and dependency installation'

runs:
  using: 'composite'
  steps:
    - uses: oven-sh/setup-bun@v2
      with:
        bun-version: latest

    - uses: actions/checkout@v7
      with:
        fetch-depth: 0

    - name: 📦 Install dependencies
      # Ignore scripts to be able to run it with the -b flag in next step.
      run: bun ci
